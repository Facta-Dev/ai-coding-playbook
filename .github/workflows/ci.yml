name: playbooks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Playbook lint
        run: python3 scripts/playbook-lint.py
      - name: Playbook copies mirror the root
        run: bash scripts/claude-kit/check-playbook-copies.sh
      - name: Generated rules are current
        run: python3 scripts/claude-kit/generate-playbook-rules.py --check
      - name: Kit validator self-test
        run: python3 scripts/claude-kit/kit_check.py --self-test
      - name: Instruction budget in every kit
        run: |
          for kit in golang rust nodejs python java extension desktop desktop-electron frontend-mobile mobile-android mobile-ios frontend cli; do
            bash scripts/instruction-budget.sh "$kit"
          done
      - name: Shell syntax
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -not -path '*/.venv/*' -not -path '*/dist/*' -print0 \
            | xargs -0 -r -n1 bash -n
      - name: Actions are pinned
        run: python3 scripts/claude-kit/pin-actions.py --check
