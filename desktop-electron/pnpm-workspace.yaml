# pnpm 11 settings for the Electron template.
#
# pnpm refuses to run dependency build scripts unless they are explicitly
# approved. These are the only two the template needs: esbuild builds Vite's
# bundler binary, and electron-winstaller is a Forge maker dependency. The
# Electron binary itself is never downloaded by the default gate
# (ELECTRON_SKIP_BINARY_DOWNLOAD=1 in scripts/verify-template.sh).
allowBuilds:
  esbuild: true
  electron-winstaller: true
