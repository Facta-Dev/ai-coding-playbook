# rustfmt config — shared by `cargo fmt` and the CI fmt-check job.
# Only stable options live here: an unstable option would be silently ignored
# by stable rustfmt, so the gate would pass without applying it.
edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
use_field_init_shorthand = true
use_try_shorthand = true