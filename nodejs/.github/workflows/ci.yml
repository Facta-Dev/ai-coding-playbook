name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

# The template ships without a lockfile (INV-T3): pnpm/action-setup reads the
# version from package.json -> packageManager (pnpm@10); installs resolve
# latest-for-range until a lockfile exists post-rename. Lane = go's, tuned:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: make ci (fmt + vet + lint + gen-check + test)
        run: make ci
      - name: unit + acceptance
        run: |
          make test
          make accept
      - name: audit
        run: pnpm audit --audit-level=high
      - name: actionlint
        uses: raven-actions/actionlint@789059c543ab20522fb3e7240794e13b0f69ad67 # v1
