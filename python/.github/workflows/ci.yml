name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

# The template ships without a lockfile (INV-T3): `uv sync` resolves
# latest-for-range until a uv.lock exists post-rename. Lane = go's, tuned.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: install uv
        run: pip install uv
      - name: sync (no shipped lockfile — INV-T3)
        run: uv sync
      - name: make ci (fmt + vet + lint + gen-check + tests + evals)
        run: make ci
      - name: audit
        run: make vuln
      - name: actionlint
        uses: raven-actions/actionlint@789059c543ab20522fb3e7240794e13b0f69ad67  # v1
